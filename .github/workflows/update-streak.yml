name: Update GitHub Streak Stats

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Streak SVG
        run: |
          curl -s -o profile/streak.svg "https://streak-stats.demolab.com?user=SahilSR81&theme=transparent&hide_border=true"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats [skip ci]"
          git push
