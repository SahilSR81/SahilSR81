name: Update GitHub Streak Stats

on:
  schedule:
    - cron: '15 19 * * *'
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Streak SVG
        run: |
          curl -s -o profile/streak.svg "https://streak-stats.demolab.com?user=SahilSR81&theme=transparent&hide_border=true"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update streak stats [skip ci]"
          git pull --rebase origin main
          git push
