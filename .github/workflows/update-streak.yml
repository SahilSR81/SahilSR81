name: Update GitHub Streak Stats

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Check if last commit is from bot
        id: check
        run: |
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Streak SVG
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -s -o profile/streak.svg "https://streak-stats.demolab.com?user=SahilSR81&theme=transparent&hide_border=true"

      - name: Commit and push if changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git push
